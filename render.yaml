services:
  - type: web
    name: heatpath-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: POSTGIS_DSN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: WAQI_TOKEN
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
